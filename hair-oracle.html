/* ── 響應式 hook ── */
function useBreakpoint() {
  const [w, setW] = useState(() => (typeof window !== "undefined" ? window.innerWidth : 768));
  useEffect(() => {
    const fn = () => setW(window.innerWidth);
    window.addEventListener("resize", fn);
    return () => window.removeEventListener("resize", fn);
  }, []);
  return { isMobile: w < 600, isTablet: w >= 600 && w < 900, isDesktop: w >= 900, w };
}

function buildPlanSystemFemale(services) {
  const svcDesc = [];
  if (services.cut) {
    const parts = [services.cut.length?.zh, services.cut.style?.zh, services.cut.bangs?.zh].filter(Boolean);
    if (parts.length) svcDesc.push(`剪髮：${parts.join("＋")}`);
  }
  if (services.perm) svcDesc.push(`燙髮：${services.perm.zh}`);
  if (services.color?.tech) {
    const c = services.color;
    svcDesc.push(`染髮：${c.swatch?.zh || ""}（${c.tech.zh}，${BRI_LEVELS[(c.bri||3)-1].zh}/${SAT_LEVELS[(c.sat||3)-1].zh}）`);
  }
  return `你是頂級美髮造型師。根據臉形分析結果與用戶選擇的服務，給出3個針對性改造方案。
用戶選擇的服務：【${svcDesc.join("；") || "未指定"}】
每個方案必須圍繞這些服務，說明為何適合此臉形，不要推薦服務範圍外的項目。
規則：只輸出純 JSON 物件，直接以 { 開頭、以 } 結尾，禁止任何 markdown、禁止說明文字。

必填欄位：recommendations（陣列含3個物件，每個物件含title/description/difficulty(easy|medium|advanced)/timeAtSalon/mainChanges陣列/baseHairPrompt英文/baseNegative英文/maskArea/maskTips）`;
}

/* ═══════════════════════════════════════════
   API CALLS
═══════════════════════════════════════════ */
function extractJSON(raw) {
  // 1. strip markdown fences (```json ... ``` or ``` ... ```)
  let s = raw.replace(/^```(?:json|JSON)?\s*/m, "").replace(/\s*```\s*$/m, "").trim();
  // 2. try direct parse
  try { return JSON.parse(s); } catch(_) {}
  // 3. extract first { ... } block (handles leading/trailing prose)
  const start = s.indexOf("{");
  const end   = s.lastIndexOf("}");
  if (start !== -1 && end !== -1 && end > start) {
    try { return JSON.parse(s.slice(start, end + 1)); } catch(_) {}
  }
  // 4. extract first [ ... ] block
  const aStart = s.indexOf("[");
  const aEnd   = s.lastIndexOf("]");
  if (aStart !== -1 && aEnd !== -1 && aEnd > aStart) {
    try { return JSON.parse(s.slice(aStart, aEnd + 1)); } catch(_) {}
  }
  throw new Error("無法解析 AI 回應，請重試。");
}

async function callClaude(system, messages, retries = 2) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:2500, system, messages })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const textBlock = data.content?.find(b => b.type === "text")?.text;
      if (!textBlock) throw new Error("AI 未回傳有效內容，請重試。");
      return extractJSON(textBlock);
    } catch (err) {
      if (attempt === retries) throw err;
      await new Promise(r => setTimeout(r, 800));
    }
  }
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ev => {
      const el = document.createElement("img");
      el.onerror = () => {
        // 圖片元素無法解析時，回退使用原始 FileReader 結果
        console.warn("Image element failed to load, using original file data.");
        resolve({ dataUrl: ev.target.result, mime: file.type });
      };
      el.onload = () => {
        const MAX = 1200;
        let w = el.naturalWidth, h = el.naturalHeight;
        if (w>MAX||h>MAX) { if(w>=h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;} }
        const c = document.createElement("canvas");
        c.width=w; c.height=h;
        c.getContext("2d").drawImage(el,0,0,w,h);
        resolve({ dataUrl:c.toDataURL("image/jpeg",0.85), mime:"image/jpeg" });
      };
      el.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function buildColorDesc(color, sat, bri) {
  if (!color) return "";
  return `${BRI_LEVELS[(bri||3)-1].en} ${SAT_LEVELS[(sat||3)-1].en} ${color.en}`.replace(/\s+/g," ").trim();
}

function buildFinalPrompt(rec, services, scanResult, gender) {
  if (!rec) return { positive:"", negative:"" };
  const parts = [];
  const isMale = gender === "male";
  const subject = isMale ? "photorealistic portrait of asian man" : "photorealistic portrait of asian woman";

  const cut = services.cut;
  const hasCut = cut && Object.values(cut).some(Boolean);

  if (hasCut) {
    if (isMale) {
      const cutDesc = [cut.topLength?.en, cut.fade?.en, cut.topStyle?.en, cut.fringe?.en].filter(Boolean).join(", ");
      parts.push(cutDesc);
    } else {
      const cutDesc = [cut.length?.en, cut.style?.en, cut.bangs?.en].filter(Boolean).join(", ");
      parts.push(cutDesc);
    }
  } else {
    const ch = scanResult?.currentHair;
    if (ch) {
      const lengthMap = { "短":"short hair","中":"medium length hair","長":"long hair" };
      const textureMap = { "直":"straight","波浪":"wavy","捲":"curly" };
      const origLen = Object.entries(lengthMap).find(([k])=>ch.length?.includes(k))?.[1] || "same length as original";
      const origTex = Object.entries(textureMap).find(([k])=>ch.texture?.includes(k))?.[1] || "";
      parts.push([origLen, origTex && origTex+" hair texture", "same hair volume as original"].filter(Boolean).join(", "));
    } else {
      parts.push("same hair length as original, do not change hairstyle structure");
    }
  }

  if (services.perm?.en) parts.push(services.perm.en);

  const col = services.color;
  const onlyColor = !hasCut && !services.perm && col?.tech && col?.swatch;
  if (col?.tech && col?.swatch) {
    const cd = buildColorDesc(col.swatch, col.sat, col.bri);
    const colorBase = `${col.tech.en}, ${cd}`;
    const recHint = (rec.baseHairPrompt || "")
      .replace(/long hair|medium (length )?hair|short hair|wavy|straight|curly|layered cut|wolf cut|bob|lob|same[^,\n]*original/gi, "")
      .replace(/\s*,\s*/g, ", ").replace(/^[\s,]+|[\s,]+$/g, "").trim();
    parts.push([colorBase, recHint].filter(s => s.length > 2).join(", "));
  }

  const planStyleMap = [
    "subtle natural tonal shift, soft depth, understated elegance",
    "defined dimensional color, rich contrast, salon-polished finish",
    "bold luminous color, high-brightness editorial look, striking visual impact",
  ];
  parts.push(planStyleMap[rec._planIndex ?? 0] || planStyleMap[0]);

  const colorOnlyNote = onlyColor ? ", ONLY change hair color, do NOT alter hair length, volume, or structure" : "";
  const baseNeg = rec.baseNegative || (isMale
    ? "ugly, blurry, distorted face, bad anatomy, watermark, feminine, long hair"
    : "ugly, blurry, distorted face, bad anatomy, watermark");
  const negExtra = onlyColor ? ", different hairstyle, hair length change" : "";

  return {
    positive: `${subject}, natural studio lighting, professional barbershop result, ${parts.join(", ")}, healthy hair, preserve facial features${colorOnlyNote}, 8k detail`,
    negative: baseNeg + negExtra,
  };
}

function buildSummaryTags(services, gender) {
  const tags = [];
  const cut = services.cut;
  if (gender === "male") {
    if (cut?.topLength)  tags.push({ label:cut.topLength.zh,  cat:"cut" });
    if (cut?.fade)       tags.push({ label:cut.fade.zh,       cat:"cut" });
    if (cut?.topStyle)   tags.push({ label:cut.topStyle.zh,   cat:"cut" });
    if (cut?.fringe && cut.fringe.id !== "no_fringe") tags.push({ label:cut.fringe.zh, cat:"cut" });
  } else {
    if (cut?.length)     tags.push({ label:cut.length.zh,     cat:"cut" });
    if (cut?.style)      tags.push({ label:cut.style.zh,      cat:"cut" });
    if (cut?.bangs && cut.bangs.id !== "no_bangs") tags.push({ label:cut.bangs.zh, cat:"cut" });
  }
  if (services.perm) tags.push({ label:services.perm.zh, cat:"perm" });
  const col = services.color;
  if (col?.tech && col?.swatch) tags.push({ label:`${col.swatch.zh}・${col.tech.zh}`, cat:"color", hex:col.swatch.hex });
  return tags;
}

                      {o.id === "mid_fade" && (

                          <div style={{ position:"absolute", top:"40%", left:0, right:0, height:"35%", background:`linear-gradient(to bottom,${accent}aa,${accent}22)` }}/>

                      {o.id === "high_fade" && (

                      {o.id === "drop_fade" && (

                      )}
                      {o.id === "undercut" && (
                        <div style={{ position:"absolute", inset:0 }}>

            </div>
          </div>

          {/* 頂部造型 */}
          <div style={{ marginBottom:".75rem" }}>
            <div style={{ fontSize:".56rem", letterSpacing:".2em", color:"#5a6a5a", textTransform:"uppercase", marginBottom:".4rem" }}>頂部造型</div>
            <div style={gridStyle}>{M_TOP_STYLE.map(o=><button key={o.id} style={btnStyle(services.cut?.topStyle?.id===o.id,"#a0c4b8")} onClick={()=>setCut("topStyle",o)}>{o.zh}</button>)}</div>

          <button onClick={()=>setServices(p=>({...p,perm:null}))} style={{ background:"none", border:"none", fontSize:".6rem", color:"#4a5a4a", cursor:"pointer", textDecoration:"underline", padding:".2rem 0" }}>清除燙髮選擇</button>

      {activeTab==="color" && (

    </div>
  );
}

/* ── 字型注入（只執行一次）── */
function useFontLoader() {
  useEffect(() => {
    if (document.getElementById("hair-oracle-fonts")) return;
    const link = document.createElement("link");
    link.id = "hair-oracle-fonts";
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono&family=DM+Sans:wght@300;400;500&display=swap";
    document.head.appendChild(link);
  }, []);
}


function HairOracle() {
  useFontLoader();
  const { isMobile, isTablet } = useBreakpoint();
  const [gender, setGender]     = useState(null); // null = not chosen yet
  const [step, setStep]         = useState("upload");
  const [preview, setPreview]   = useState(null);
  const [imgData, setImgData]   = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const [error, setError]       = useState("");
  const [scanResult, setScanResult] = useState(null);
  const [planResult, setPlanResult] = useState(null);
  const [activeRec, setActiveRec]   = useState(0);
  const [statusMsg, setStatusMsg]   = useState("");
  const [services, setServices] = useState({ cut:null, perm:null, color:null });
  const fileRef   = useRef();
  const cameraRef = useRef();

  const px = isMobile ? "1rem" : "1.4rem";
  const isMale = gender === "male";
  /* accent colors by gender */
  const ACC  = isMale ? "#a0c4b8" : "#c8a97e";
  const ACC2 = isMale ? "rgba(160,196,184," : "rgba(200,169,126,";

  const pickFile = async f => {
    if (!f?.type.startsWith("image/")) return;
    setError("");
    try {
      const { dataUrl, mime } = await compressImage(f);
      setPreview(dataUrl); setImgData({ b64:dataUrl.split(",")[1], mime });
    } catch { setError("圖片讀取失敗，請重試。"); }
  };

  const doScan = async () => {
    if (!imgData) return;
    setStep("scanning"); setError("");
    setStatusMsg("辨識臉形與現有髮型特徵…");
    try {
      const res = await scanPhoto(imgData.b64, imgData.mime, gender);
      res.info = FACE_INFO[res.faceShape] || FACE_INFO.oval;
      setScanResult(res);
      setStep("pick_service");
    } catch(e) { setError("分析失敗：" + e.message); setStep("upload"); setStatusMsg(""); }
  };

  const doGeneratePlans = async () => {
    const hasSvc = services.cut || services.perm || services.color;
    if (!hasSvc) { setError("請至少選擇一項服務"); return; }    setError(""); setStep("generating");
    setStatusMsg("根據您的選擇生成針對性改造方案…");
    try {
      const res = await generatePlans(scanResult, services, gender);
      setPlanResult(res); setActiveRec(0); setStep("result");
    } catch(e) { setError("方案生成失敗：" + e.message); setStep("pick_service"); setStatusMsg(""); }
  };

  const reset = () => {
    setStep("upload"); setPreview(null); setImgData(null);
    setScanResult(null); setPlanResult(null); setError("");
    setServices({ cut:null, perm:null, color:null });
  };
  const rePickService = () => {
    setPlanResult(null); setError(""); setActiveRec(0);
    setServices({ cut:null, perm:null, color:null });
    setStep("pick_service");
  };

  const hasSvc = !!(services.cut || services.perm || services.color);

  const rec  = planResult?.recommendations?.[activeRec];
  const diff = rec ? (DIFF[rec.difficulty]||DIFF.easy) : null;
  const finalPrompts = useMemo(()=> buildFinalPrompt(rec ? {...rec, _planIndex:activeRec} : rec, services, scanResult, gender), [rec, activeRec, services, scanResult, gender]);
  const summaryTags  = useMemo(()=> buildSummaryTags(services, gender), [services, gender]);

  const fullCopyText = rec ? `=== 方案 ${activeRec+1}：${rec.title} ===
難度：${diff?.label}  |  時間：${rec.timeAtSalon}
造型：${summaryTags.map(t=>t.label).join(" · ")}
${isMale && rec.fadeAdvice ? `\n【刀法建議】\n${rec.fadeAdvice}` : ""}
${isMale && rec.stylingTip ? `\n【打理技巧】\n${rec.stylingTip}` : ""}

【Positive Prompt】
${finalPrompts.positive}

【Negative Prompt】
${finalPrompts.negative}


【遮罩】${rec.maskArea}
${rec.maskTips}` : "";

    background: cat==="cut"?"rgba(160,196,184,.1)":cat==="perm"?"rgba(196,188,154,.1)":"rgba(200,169,126,.1)",

              const active = curIdx===sIdx || (s.id==="pick_service"&&step==="scanning") || (s.id==="result"&&step==="generating");

                <div key={s.id} style={{ display:"flex", alignItems:"center", gap:".2rem", flex: isMobile ? 1 : "none" }}>
                  <div style={{
                    display:"flex", alignItems:"center", justifyContent:"center", gap:".28rem",
                    padding: isMobile ? ".22rem .2rem" : ".2rem .55rem", borderRadius:"20px", fontSize:".62rem",
                    width: isMobile ? "100%" : "auto",
                    border:`1px solid ${done?"rgba(160,196,184,.3)":active?`${ACC2}.4)`:"rgba(255,255,255,.07)"}`,
                    color: done?"#a0c4b8":active?ACC:"#4a3a2a",
                    background: done?"rgba(160,196,184,.06)":active?`${ACC2}.08)`:"transparent"
                  }}>
                    <span style={{ width:13, height:13, borderRadius:"50%", background:"currentColor", color:"#0a0907", fontSize:".5rem", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>{done?"✓":i+1}</span>
                    <span>{s.label}</span>
                  </div>
                  {i<arr.length-1&&<span style={{ fontSize:".65rem", color:done?"#5a4a3a":"#2a2018", flexShrink:0 }}>›</span>}
                </div>
              );
            })}
          </div>
        </div>
      </header>

      <main style={{ maxWidth:860, margin:"0 auto", padding:`1.6rem ${px} 6rem` }}>

        {/* ── UPLOAD ── */}
        {step==="upload" && (
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap: isMobile ? "1.2rem" : "1.6rem" }}>
            <div style={{ textAlign:"center" }}>
              <h1 style={{ fontFamily:"'Cormorant Garamond'", fontSize:"clamp(1.8rem,6vw,3rem)", fontWeight:300 }}>
                {isMale ? "男士 AI 髮型顧問" : "AI 髮型顧問"}
              </h1>
              <p style={{ fontSize:".7rem", letterSpacing:".14em", color:"#8a7a6a", marginTop:".4rem", textTransform:"uppercase" }}>
                {isMale ? "上傳照片 · Fade 刀法 · 造型搭配" : "上傳照片 · 選擇服務 · 獲得改造建議"}
              </p>
            </div>

            {/* ── Preview area (tap to open gallery) ── */}
            <div
              onClick={()=>fileRef.current.click()}
              onDragOver={e=>{e.preventDefault();setDragOver(true);}}
              onDragLeave={()=>setDragOver(false)}
              onDrop={e=>{e.preventDefault();setDragOver(false);pickFile(e.dataTransfer.files[0]);}}
              style={{
                width:"100%", maxWidth:440, minHeight: isMobile ? 180 : 200,
                border:`1px dashed ${dragOver?ACC:`${ACC2}.3)`}`,
                borderRadius:"8px", cursor:"pointer", overflow:"hidden",
                display:"flex", alignItems:"center", justifyContent:"center",
                background: dragOver?`${ACC2}.06)`:`${ACC2}.025)`,
                transition:"all .25s", position:"relative", touchAction:"manipulation",
              }}>
              {!preview
                ? <div style={{ textAlign:"center", padding:"2rem" }}>
                    <div style={{ fontSize:"2rem", marginBottom:".7rem" }}>{isMale?"🧔":"🖼️"}</div>
                    <p style={{ fontSize: isMobile ? ".85rem" : ".9rem", color:ACC, marginBottom:".35rem" }}>點擊從圖庫選取</p>
                    <p style={{ fontSize:".63rem", color:"#5a4a3a" }}>建議正面清晰臉部照 · 自動壓縮</p>
                  </div>
                : <>
                    <img src={preview} alt="preview" style={{ width:"100%", height: isMobile?180:200, objectFit:"cover" }}/>
                    <div style={{ position:"absolute", bottom:0, left:0, right:0, background:"rgba(10,9,7,.75)", padding:".4rem", textAlign:"center", fontSize:".7rem", color:ACC }}>點擊更換</div>
                  </>
              }
            </div>

            {/* ── 圖庫 / 相機 兩個隱藏 input ── */}
            <input ref={fileRef}   type="file" accept="image/*" style={{ display:"none" }} onClick={e=>{e.target.value="";}} onChange={e=>pickFile(e.target.files[0])}/>
            <input ref={cameraRef} type="file" accept="image/*" capture="environment" style={{ display:"none" }} onClick={e=>{e.target.value="";}} onChange={e=>pickFile(e.target.files[0])}/>

            {/* ── Mobile camera button (only shown when no preview, on mobile/tablet) ── */}
            {isMobile && (
              <div style={{ display:"flex", gap:".6rem", width:"100%", maxWidth:440 }}>
                <button
                  onClick={()=>fileRef.current.click()}
                  style={{
                    flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:".45rem",
                    padding:".65rem .5rem",
                    border:`1px solid ${ACC2}.25)`, background:`${ACC2}.04)`,
                    borderRadius:"6px", cursor:"pointer", fontSize:".78rem", color:ACC,
                    touchAction:"manipulation", WebkitTapHighlightColor:"transparent",
                  }}>
                  <span style={{ fontSize:"1.1rem" }}>🖼️</span>
                  <span>圖庫選取</span>
                </button>
                <button
                  onClick={()=>cameraRef.current.click()}
                  style={{
                    flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:".45rem",
                    padding:".65rem .5rem",
                    border:`1px solid ${ACC2}.25)`, background:`${ACC2}.04)`,
                    borderRadius:"6px", cursor:"pointer", fontSize:".78rem", color:ACC,
                    touchAction:"manipulation", WebkitTapHighlightColor:"transparent",
                  }}>
                  <span style={{ fontSize:"1.1rem" }}>📷</span>
                  <span>直接拍照</span>
                </button>
              </div>
            )}
            {error && <p style={{ color:"#c46060", fontSize:".78rem", maxWidth:440, textAlign:"center" }}>{error}</p>}

            <button disabled={!preview} onClick={doScan}
              style={{
                width:"100%", maxWidth:360, padding: isMobile ? "1rem" : ".9rem 1.5rem",
                background: preview?`linear-gradient(135deg,${ACC2}.09),${ACC2}.03))`:"transparent",
                border:`1px solid ${preview?ACC:`${ACC2}.2)`}`, color: preview?ACC:"#4a3a2a",
                borderRadius:"4px", cursor:preview?"pointer":"not-allowed",
                fontFamily:"'Cormorant Garamond'", fontSize: isMobile ? "1rem" : "1.05rem",
                letterSpacing:".2em", transition:"all .28s", touchAction:"manipulation",
              }}>
              分析臉形 → 選擇服務 ✦
            </button>
          </div>
        )}

        {/* ── SCANNING / GENERATING ── */}
        {(step==="scanning"||step==="generating") && (
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:"2rem", paddingTop:"1.5rem" }}>
            <div style={{ position:"relative", width: isMobile ? 180 : 220, height: isMobile ? 180 : 220 }}>
              <img src={preview} alt="" style={{ width:"100%", height:"100%", objectFit:"cover", borderRadius:6, filter:"grayscale(20%)" }}/>
              <div style={{ position:"absolute", top:0, left:0, right:0, height:2, background:`linear-gradient(90deg,transparent,${ACC},transparent)`, animation:"scan 2s linear infinite" }}/>
              {[{top:0,left:0,borderWidth:"2px 0 0 2px"},{top:0,right:0,borderWidth:"2px 2px 0 0"},{bottom:0,left:0,borderWidth:"0 0 2px 2px"},{bottom:0,right:0,borderWidth:"0 2px 2px 0"}].map((pos,i)=>(
                <span key={i} style={{ position:"absolute", width:13, height:13, borderColor:ACC, borderStyle:"solid", ...pos }}/>
              ))}
            </div>
            <div style={{ textAlign:"center" }}>
              <div style={{ width:28, height:28, border:`2px solid ${ACC2}.2)`, borderTopColor:ACC, borderRadius:"50%", animation:"spin 1s linear infinite", margin:"0 auto .8rem" }}/>
              <h2 style={{ fontFamily:"'Cormorant Garamond'", fontSize:"1.4rem", fontWeight:300 }}>{step==="scanning"?"臉形掃描中…":"生成改造方案…"}</h2>
              <p style={{ fontSize:".72rem", color:"#8a7a6a", marginTop:".35rem" }}>{statusMsg}</p>
            </div>
          </div>
        )}

        {/* ── PICK SERVICE ── */}
        {step==="pick_service" && scanResult && (
          <div style={{ display:"flex", flexDirection:"column", gap:"1.2rem" }}>
            {/* Face card */}
            <div style={{
              display:"grid", gridTemplateColumns: isMobile ? "1fr" : "130px 1fr", gap: isMobile ? ".9rem" : "1.3rem",
              padding: isMobile ? "1rem" : "1.3rem", borderRadius:6,
              border:`1px solid ${ACC2}.12)`, borderLeft:`4px solid ${scanResult.info.color}`,
              background:`${ACC2}.03)`
            }}>
              <div style={{ display:"flex", flexDirection: isMobile ? "row" : "column", alignItems: isMobile ? "center" : "flex-start", gap: isMobile ? "1rem" : 0 }}>
                <div>
                  <div style={{ fontSize:".56rem", letterSpacing:".22em", color:"#8a7a6a", textTransform:"uppercase", marginBottom:".26rem" }}>臉形診斷</div>
                  <div style={{ fontFamily:"'Cormorant Garamond'", fontSize: isMobile ? "1.6rem" : "1.9rem", fontWeight:300, color:scanResult.info.color, lineHeight:1.1 }}>{scanResult.info.zh}</div>
                  <div style={{ fontSize:".68rem", letterSpacing:".18em", color:"#5a4a3a", textTransform:"uppercase", marginTop:".15rem" }}>{scanResult.info.en}</div>
                </div>
                <div style={{ flex:1, minWidth:80 }}>
                  <div style={{ height:3, background:"rgba(255,255,255,.09)", borderRadius:2, margin:".55rem 0 .15rem", overflow:"hidden" }}>
                    <div style={{ height:"100%", width:`${scanResult.confidence||82}%`, background:scanResult.info.color, borderRadius:2 }}/>
                  </div>
                  <div style={{ fontSize:".58rem", color:"#5a4a3a" }}>可信度 {scanResult.confidence||82}%</div>
                </div>
              </div>
              <div>
                <p style={{ fontFamily:"'Cormorant Garamond'", fontStyle:"italic", fontSize:".84rem", color:scanResult.info.color, borderLeft:`2px solid ${scanResult.info.color}`, paddingLeft:".7rem", marginBottom:".45rem", lineHeight:1.55 }}>「{scanResult.faceAnalysis}」</p>
                <p style={{ fontSize:".72rem", color:"#8a7a6a", lineHeight:1.65, marginBottom:".45rem" }}>{scanResult.info.desc}</p>
                <div style={{ fontSize:".73rem", color:"#a09080", lineHeight:1.7, padding:".5rem .7rem", background:"rgba(0,0,0,.18)", borderRadius:4 }}>{scanResult.currentAssessment}</div>
                {scanResult.assessmentTags && (
                  <div style={{ display:"flex", flexWrap:"wrap", gap:".25rem", marginTop:".45rem" }}>
                    {scanResult.assessmentTags.pros?.map(t=>(
                      <span key={t} style={{ padding:".14rem .5rem", borderRadius:20, fontSize:".62rem", background:"rgba(160,196,184,.1)", color:"#a0c4b8", border:"1px solid rgba(160,196,184,.2)" }}>✅ {t}</span>
                    ))}
                    {scanResult.assessmentTags.cons?.map(t=>(
                      <span key={t} style={{ padding:".14rem .5rem", borderRadius:20, fontSize:".62rem", background:"rgba(196,188,154,.1)", color:"#c4bc9a", border:"1px solid rgba(196,188,154,.2)" }}>⚡ {t}</span>
                    ))}
                  </div>
                )}
                {/* Male: show fade info if available */}
                {isMale && scanResult.currentHair?.fadeType && (
                  <div style={{ marginTop:".45rem", padding:".35rem .6rem", background:"rgba(160,196,184,.07)", border:"1px solid rgba(160,196,184,.18)", borderRadius:4, fontSize:".66rem", color:"#a0c4b8" }}>
                    ✂ 現有刀法：{scanResult.currentHair.fadeType}
                  </div>
                )}
              </div>
            </div>

            {isMale
              ? <MaleServicePicker services={services} setServices={setServices} isMobile={isMobile}/>
              : <FemaleServicePicker services={services} setServices={setServices} isMobile={isMobile}/>
            }

            {hasSvc && summaryTags.length>0 && (
              <div style={{ display:"flex", flexWrap:"wrap", gap:".32rem", padding:".65rem .9rem", background:`${ACC2}.05)`, border:`1px solid ${ACC2}.14)`, borderRadius:6 }}>
                {summaryTags.map((t,i)=>(
                  <span key={i} style={tagStyle(t.cat)}>
                    {t.hex && <span style={{ width:7, height:7, borderRadius:"50%", background:t.hex, border:"1px solid rgba(255,255,255,.2)", flexShrink:0 }}/>}
                    {t.label}
                  </span>
                ))}
              </div>
            )}
            {error && <p style={{ color:"#c46060", fontSize:".78rem" }}>{error}</p>}
            <button disabled={!hasSvc} onClick={doGeneratePlans}
              style={{
                width:"100%", padding: isMobile ? "1rem" : ".95rem 1.5rem",
                background: hasSvc?`linear-gradient(135deg,${ACC2}.09),${ACC2}.03))`:"transparent",
                border:`1px solid ${hasSvc?ACC:`${ACC2}.2)`}`,
                color: hasSvc?ACC:"#4a3a2a",
                borderRadius:4, cursor:hasSvc?"pointer":"not-allowed",
                fontFamily:"'Cormorant Garamond'", fontSize: isMobile ? "1.05rem" : "1.1rem",
                letterSpacing:".2em", transition:"all .28s", touchAction:"manipulation",
              }}>
              生成我的改造方案 ✦
            </button>
          </div>
        )}

        {/* ── RESULT ── */}
        {step==="result" && planResult && scanResult && (
          <div style={{ display:"flex", flexDirection:"column", gap:"1.3rem" }}>
            {/* Banner */}
            <div style={{
              display:"flex", alignItems:"center", gap:".8rem", flexWrap:"wrap",
              padding: isMobile ? ".8rem" : ".9rem 1.3rem", borderRadius:6,
              border:`1px solid ${ACC2}.14)`, borderLeft:`4px solid ${scanResult.info.color}`,
              background:`${ACC2}.04)`
            }}>
              <div>
                <div style={{ fontFamily:"'Cormorant Garamond'", fontSize:"1.05rem", color:scanResult.info.color }}>{scanResult.info.zh}</div>
                <div style={{ fontSize:".65rem", letterSpacing:".18em", color:"#5a4a3a", textTransform:"uppercase" }}>{scanResult.info.en}</div>
              </div>
              <span style={{ color:"#3a2a1a" }}>×</span>
              <div style={{ display:"flex", flexWrap:"wrap", gap:".28rem" }}>
                {summaryTags.map((t,i)=>(
                  <span key={i} style={tagStyle(t.cat)}>
                    {t.hex && <span style={{ width:7, height:7, borderRadius:"50%", background:t.hex, border:"1px solid rgba(255,255,255,.2)", flexShrink:0 }}/>}
                    {t.label}
                  </span>
                ))}
              </div>
            </div>

            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:".6rem" }}>
              <div>
                <h2 style={{ fontFamily:"'Cormorant Garamond'", fontSize: isMobile ? "1.35rem" : "1.55rem", fontWeight:300 }}>✦ 針對性改造方案</h2>
                <p style={{ fontSize:".66rem", color:"#5a4a3a", marginTop:".1rem" }}>臉形 × {isMale?"刀法造型":"服務"}量身生成</p>
              </div>
              <button onClick={rePickService} style={{ display:"flex", alignItems:"center", gap:".35rem", padding: isMobile ? ".5rem .9rem" : ".5rem 1.1rem", border:`1px solid ${ACC2}.4)`, background:`${ACC2}.07)`, color:ACC, borderRadius:4, cursor:"pointer", fontSize: isMobile ? ".72rem" : ".75rem", touchAction:"manipulation" }}>
                <span>↺</span><span>換個造型</span>
              </button>
            </div>

            {/* Plan tabs */}
            <div style={{ display:"grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(3,1fr)", gap:".6rem" }}>
              {planResult.recommendations?.map((r,i)=>{
                const d = DIFF[r.difficulty]||DIFF.easy;
                return (
                  <button key={i} onClick={()=>setActiveRec(i)}
                    style={{
                      display:"flex", flexDirection: isMobile ? "row" : "column",
                      alignItems: isMobile ? "center" : "flex-start", gap: isMobile ? ".6rem" : ".18rem",
                      padding: isMobile ? ".75rem 1rem" : ".85rem .9rem",
                      border:`1px solid ${activeRec===i?d.color:"rgba(255,255,255,.08)"}`,
                      background: activeRec===i?d.bg:"rgba(255,255,255,.02)",
                      borderRadius:6, cursor:"pointer", textAlign:"left", transition:"all .22s", touchAction:"manipulation",
                    }}>
                    <div style={{ display:"flex", alignItems:"center", gap:".5rem", flex: isMobile ? 1 : "none" }}>
                      <span style={{ width:24, height:24, borderRadius:"50%", flexShrink:0, border:`1px solid ${activeRec===i?d.color:"rgba(255,255,255,.12)"}`, background: activeRec===i?d.bg:"transparent", display:"flex", alignItems:"center", justifyContent:"center", fontSize:".6rem", color:d.color }}>{i+1}</span>
                      <span style={{ fontSize: isMobile ? ".82rem" : ".75rem", color:"#e8ddd0", lineHeight:1.35 }}>{r.title}</span>
                    </div>
                    <div style={{ display:"flex", gap:".4rem", flexShrink:0, flexWrap:"wrap" }}>
                      <span style={{ fontSize:".6rem", color:d.color }}>{d.label}</span>
                      <span style={{ fontSize:".6rem", color:"#5a4a3a" }}>⏱ {r.timeAtSalon}</span>
                    </div>
                  </button>
                );
              })}
            </div>

            {/* Plan detail */}
            {rec && (
              <div style={{ background:"rgba(255,255,255,.02)", border:"1px solid rgba(255,255,255,.07)", borderRadius:8, overflow:"hidden" }}>
                <div style={{ display:"flex", alignItems:"flex-start", gap:".7rem", padding: isMobile ? "1.1rem 1rem 0" : "1.4rem 1.6rem 0" }}>
                  <span style={{ fontFamily:"'Cormorant Garamond'", fontSize: isMobile ? "2.2rem" : "3rem", fontWeight:300, color:"rgba(200,169,126,.14)", lineHeight:1, flexShrink:0 }}>0{activeRec+1}</span>
                  <div style={{ paddingTop:".2rem" }}>
                    <h3 style={{ fontSize: isMobile ? ".95rem" : "1.05rem", fontWeight:600, color:"#e8ddd0" }}>{rec.title}</h3>
                    <div style={{ display:"flex", gap:".3rem", flexWrap:"wrap", marginTop:".4rem" }}>
                      <span style={{ padding:".13rem .5rem", borderRadius:20, fontSize:".6rem", color:diff.color, background:diff.bg }}>{diff.label}</span>
                      <span style={{ padding:".13rem .5rem", borderRadius:20, fontSize:".6rem", background:"rgba(200,169,126,.08)", color:"#8a7a6a" }}>⏱ {rec.timeAtSalon}</span>
                    </div>
                  </div>
                </div>

                <p style={{ fontSize:".8rem", color:"#a09080", lineHeight:1.9, padding: isMobile ? ".9rem 1rem" : "1rem 1.6rem", borderBottom:"1px solid rgba(255,255,255,.05)" }}>{rec.description}</p>

                {rec.mainChanges?.length>0 && (
                  <div style={{ padding: isMobile ? ".9rem 1rem" : "1rem 1.6rem", borderBottom:"1px solid rgba(255,255,255,.05)" }}>
                    <div style={{ fontSize:".55rem", letterSpacing:".18em", color:"#8a7a6a", textTransform:"uppercase", marginBottom:".55rem" }}>主要改動</div>
                    {rec.mainChanges.map((c,i)=>(
                      <div key={i} style={{ display:"flex", gap:".45rem", alignItems:"flex-start", fontSize:".78rem", color:"#a09080", marginBottom:".32rem" }}>
                        <span style={{ color:ACC, fontSize:".36rem", marginTop:".36rem", flexShrink:0 }}>◆</span>
                        <span>{c}</span>
                      </div>
                    ))}
                  </div>
                )}

                {/* Male-only: Fade Advice + Styling Tip */}
                {isMale && (rec.fadeAdvice || rec.stylingTip) && (
                  <div style={{ padding: isMobile ? ".9rem 1rem" : "1rem 1.6rem", borderBottom:"1px solid rgba(255,255,255,.05)", display:"grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap:"1rem" }}>
                    {rec.fadeAdvice && (
                      <div style={{ background:"rgba(160,196,184,.06)", border:"1px solid rgba(160,196,184,.15)", borderRadius:6, padding:".7rem .9rem" }}>
                        <div style={{ fontSize:".55rem", letterSpacing:".18em", color:"#a0c4b8", textTransform:"uppercase", marginBottom:".38rem" }}>✂ 刀法建議</div>
                        <p style={{ fontSize:".74rem", color:"#a0b8b0", lineHeight:1.75 }}>{rec.fadeAdvice}</p>
                      </div>
                    )}
                    {rec.stylingTip && (
                      <div style={{ background:"rgba(196,188,154,.06)", border:"1px solid rgba(196,188,154,.15)", borderRadius:6, padding:".7rem .9rem" }}>
                        <div style={{ fontSize:".55rem", letterSpacing:".18em", color:"#c4bc9a", textTransform:"uppercase", marginBottom:".38rem" }}>💈 打理技巧</div>
                        <p style={{ fontSize:".74rem", color:"#b0a888", lineHeight:1.75 }}>{rec.stylingTip}</p>
                      </div>
                    )}
                  </div>
                )}

                {/* ComfyUI Box */}
                <div style={{ borderTop:"1px solid rgba(255,255,255,.07)" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:".75rem", padding: isMobile ? ".8rem 1rem" : ".9rem 1.6rem", background:"rgba(0,0,0,.2)", flexWrap:"wrap" }}>
                    <span style={{ fontSize:"1rem", flexShrink:0 }}>⚙️</span>
                    <div>
                      <div style={{ fontSize: isMobile ? ".78rem" : ".84rem", color:ACC }}>ComfyUI Flux Inpainting Prompt</div>
                      <div style={{ fontSize:".62rem", color:"#8a7a6a", marginTop:".08rem" }}>{summaryTags.map(t=>t.label).join(" · ")}</div>
                    </div>
                  </div>
                  {[["✅ Positive","#a0c4b8",finalPrompts.positive],["❌ Negative","#c4a0a0",finalPrompts.negative]].map(([lbl,clr,txt])=>(
                    <div key={lbl} style={{ padding: isMobile ? ".8rem 1rem" : ".9rem 1.6rem", borderBottom:"1px solid rgba(255,255,255,.05)" }}>
                      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:".4rem" }}>
                        <span style={{ fontSize:".58rem", letterSpacing:".08em", textTransform:"uppercase", color:clr }}>{lbl}</span>
                        <CopyBtn text={txt} label="複製"/>
                      </div>
                      <div style={{ overflowX:"auto", WebkitOverflowScrolling:"touch" }}>
                        <pre style={{ background:"rgba(0,0,0,.42)", border:"1px solid rgba(255,255,255,.07)", borderRadius:4, padding: isMobile ? ".6rem .7rem" : ".65rem .8rem", fontFamily:"'DM Mono',monospace", fontSize: isMobile ? ".62rem" : ".66rem", color:"#b8c8b4", lineHeight:1.6, whiteSpace:"pre-wrap", wordBreak:"break-all", margin:0 }}>{txt}</pre>
                      </div>
                    </div>
                  ))}
                  <div style={{ padding: isMobile ? ".8rem 1rem" : ".85rem 1.6rem", borderBottom:"1px solid rgba(255,255,255,.05)", background:"rgba(196,188,154,.03)" }}>
                    <div style={{ fontSize:".6rem", letterSpacing:".12em", color:"#c4bc9a", textTransform:"uppercase", marginBottom:".38rem" }}>🖌️ 遮罩建議</div>
                    <span style={{ display:"inline-block", padding:".12rem .5rem", background:"rgba(196,188,154,.12)", border:"1px solid rgba(196,188,154,.24)", borderRadius:20, fontSize:".62rem", color:"#c4bc9a", marginBottom:".38rem" }}>{rec.maskArea}</span>
                    <p style={{ fontSize:".72rem", color:"#8a7a6a", lineHeight:1.7 }}>{rec.maskTips}</p>
                  </div>
                  <div style={{ padding: isMobile ? ".8rem 1rem" : ".85rem 1.6rem" }}>
                    <CopyBtn block text={fullCopyText} label="📋 一鍵複製全部設定"/>
                  </div>
                </div>
              </div>
